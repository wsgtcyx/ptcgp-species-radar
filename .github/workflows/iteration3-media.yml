name: Iteration 3 image-first original post inspection
on:
  push:
    paths:
      - .github/workflows/iteration3-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q Pillow
      - name: Download first-party social images for review and read additional public feeds
        run: python scripts/iteration3_media.py
      - name: Save image audit and actor feed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/2026-11-22-160310-iteration3-media-probe.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Keep image originals and additional author feeds for manual review"
          git pull --rebase origin main
          git push origin HEAD:main
