name: Iteration 3 original-player source discovery probe
on:
  push:
    paths:
      - .github/workflows/iteration3-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read first-party public source records and site pages
        run: python scripts/iteration3_collect.py
      - name: Save unassessed public source metadata without claiming eligibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/2026-11-22-160310-iteration3-live-probe.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Save iteration 3 original-source probe observations (not yet qualified)"
          git pull --rebase origin main
          git push origin HEAD:main
