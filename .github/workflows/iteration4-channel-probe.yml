name: Iteration 4 first-party creator channels and site probe
on:
  push:
    paths:
      - .github/workflows/iteration4-channel-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe YouTube creator feeds and original posts (no source counts asserted)
        run: python3 scripts/iteration4_channel_probe.py
      - name: Commit immutable raw probe for evidence assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/2026-11-22-161536-iteration4-channel-probe.json
          git diff --staged --quiet && exit 0
          git commit -m "Record iteration 4 first-party channel and original-source probe (unassessed)"
          git pull --rebase origin main
          git push origin HEAD:main
